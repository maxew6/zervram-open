[package]
name = "zervram-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Compiles cleanly on Windows/Linux with zero C/CUDA/ROCm SDKs via runtime libloading
default = ["mock-gpu", "cuda-native", "rocm-native"]
mock-gpu = ["dep:rand", "dep:rand_chacha", "dep:zeroize"]
cuda-native = ["dep:libloading"]
rocm-native = ["dep:libloading"]
tt-metalium-native = []
furiosa-native = []

[dependencies]
async-trait = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }

# Runtime dynamic driver loader (zero compile-time SDK headers required)
libloading  = { workspace = true, optional = true }

# Optional dependencies used solely by mock-gpu
rand        = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
zeroize     = { workspace = true, optional = true }

[dev-dependencies]
serde_json  = { workspace = true }