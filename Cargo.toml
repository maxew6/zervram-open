[workspace]
resolver = "2"
# 5-crate Zervram workspace:
# zervram-hal, zervram-scrub, zervram-tpp, zervram-k8s, zervram-cli
members = ["crates/zervram-hal", "crates/zervram-scrub"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["Zervram Systems Engineering"]
repository = "https://github.com/zervram/zervram"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# Internal workspace crates
zervram-hal   = { path = "crates/zervram-hal", default-features = false }
zervram-scrub = { path = "crates/zervram-scrub" }
zervram-tpp   = { path = "crates/zervram-tpp" }
zervram-k8s   = { path = "crates/zervram-k8s" }

# Core required crates (pure Rust + rustls/ed25519-dalek; zero OpenSSL or CUDA C headers)
thiserror      = "2.0"
tokio          = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
axum           = { version = "0.8", features = ["ws", "json", "macros"] }
rustls         = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls   = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2.2"
ed25519-dalek  = { version = "2.1", features = ["pem", "rand_core", "pkcs8", "zeroize"] }
sha2           = "0.10"
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
chrono         = { version = "0.4", features = ["serde"] }
uuid           = { version = "1.12", features = ["v4", "v7", "serde"] }

# Supporting pure-Rust crates
async-trait        = "0.1"
clap               = { version = "4.5", features = ["derive", "env"] }
futures-util       = "0.3"
hex                = "0.4"
rand               = "0.8"
rand_chacha        = "0.3"
tower              = { version = "0.5", features = ["timeout", "limit"] }
tower-http         = { version = "0.6", features = ["trace", "cors", "limit"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
zeroize            = { version = "1.8", features = ["derive"] }

